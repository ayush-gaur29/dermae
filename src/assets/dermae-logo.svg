<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%" fill="none">
  <!-- Brand Emblem (Stylized botanical/cellular radiance symbol) -->
  <g transform="translate(10, 8)">
    <!-- Subtle outer ring -->
    <circle cx="32" cy="32" r="30" stroke="#B08A4F" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="2 2" />
    <circle cx="32" cy="32" r="24" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.75" />
    
    <!-- Radiance / Botanical Petals -->
    <path d="M32 12 C32 22 22 32 32 32 C42 32 32 22 32 12 Z" fill="#B08A4F" fill-opacity="0.85" />
    <path d="M32 52 C32 42 42 32 32 32 C22 32 32 42 32 52 Z" fill="#B08A4F" fill-opacity="0.85" />
    <path d="M12 32 C22 32 32 42 32 32 C32 22 22 32 12 32 Z" fill="#78947E" fill-opacity="0.85" />
    <path d="M52 32 C42 32 32 22 32 32 C32 42 42 32 52 32 Z" fill="#78947E" fill-opacity="0.85" />
    
    <!-- Central Core -->
    <circle cx="32" cy="32" r="4.5" fill="#B08A4F" />
    <circle cx="32" cy="32" r="2" fill="#FCFAF5" />
  </g>

  <!-- Wordmark: DERMAÉ -->
  <g transform="translate(86, 44)">
    <text font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="600" letter-spacing="4.5" fill="currentColor">
      DERMA<tspan fill="#B08A4F">É</tspan>
    </text>
  </g>

  <!-- Subtitle Tagline: CLINICAL SKINCARE & AESTHETICS -->
  <g transform="translate(88, 62)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="500" letter-spacing="3.2" fill="#B08A4F" text-transform="uppercase">
      CLINICAL SKINCARE &amp; AESTHETICS
    </text>
  </g>
</svg>

